# cargo-deny configuration. Run with: cargo deny check

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
# Any unpatched advisory should fail the build rather than warn.
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses only; nothing copyleft can enter the tree unnoticed.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A second TLS stack pulled in by accident means unaudited crypto in the build.
# OpenSSL is still allowed on the one deliberate path to it: the `native-tls`
# feature, which on Linux is backed by OpenSSL. Anything else that drags it in
# fails the check.
deny = [
    { name = "openssl", wrappers = ["native-tls"], reason = "use the rustls-tls feature, or opt into native-tls deliberately" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
